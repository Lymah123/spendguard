[package]
name = "spendguard"
version = "0.1.0"
edition = "2021"
description = "Policy-controlled AI payment agent for Solana"

[features]
default = []
# Optional read-only dashboard. Off by default; not needed for the MVP.
web = ["dep:axum"]

[dependencies]
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
solana-sdk = "2"
solana-client = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

axum = { version = "0.7", optional = true }